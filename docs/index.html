<html>
<head>
<meta charset="utf-8">
<title>It-Depends | Dependency Graphs</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #d8d8d8;
    --row-hover: #f0f0f0;
    --row-active: #e4edff;
    --badge-degenerate-bg: #fde3cf;
    --badge-degenerate-fg: #8a4b0a;
    --badge-vulns-bg: #dff3df;
    --badge-vulns-fg: #226622;
    --link: #1554c4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  #app {
    display: flex;
    height: 100vh;
    width: 100%;
  }
  #sidebar {
    width: 320px;
    min-width: 320px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 {
    font-size: 15px;
    margin: 0 0 8px 0;
  }
  #filter {
    width: 100%;
    padding: 6px 8px;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  #repo-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .repo-row {
    display: block;
    padding: 8px 12px;
    cursor: pointer;
    border-bottom: 1px solid #eeeeee;
    text-decoration: none;
    color: inherit;
  }
  .repo-row:hover { background: var(--row-hover); }
  .repo-row.active { background: var(--row-active); }
  .repo-name {
    font-size: 13px;
    font-weight: 600;
    word-break: break-word;
  }
  .repo-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 4px;
  }
  .badge-degenerate {
    background: var(--badge-degenerate-bg);
    color: var(--badge-degenerate-fg);
  }
  .badge-vulns {
    background: var(--badge-vulns-bg);
    color: var(--badge-vulns-fg);
  }
  details.group summary {
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 1px solid #eeeeee;
  }
  #not-published {
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    font-size: 11px;
    color: var(--muted);
  }
  #not-published h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 6px 0;
  }
  #not-published ul {
    margin: 0;
    padding-left: 16px;
  }
  #not-published li {
    margin-bottom: 4px;
  }
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    min-width: 0;
  }
  #header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  #header h2 {
    margin: 0 0 4px 0;
    font-size: 16px;
  }
  #header-meta {
    font-size: 12px;
    color: var(--muted);
  }
  #header-links {
    margin-top: 6px;
    font-size: 12px;
  }
  #header-links a {
    color: var(--link);
    margin-right: 12px;
  }
  #note {
    margin-top: 6px;
    font-size: 12px;
    color: var(--badge-degenerate-fg);
  }
  #frame-wrap {
    flex: 1;
    padding: 12px 16px 16px 16px;
    min-height: 0;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 1px solid var(--border);
    display: block;
  }
  #landing {
    padding: 24px;
    max-width: 640px;
    line-height: 1.5;
    font-size: 14px;
  }
  #landing h2 { margin-top: 0; }
  #landing ul { padding-left: 20px; }
  #footer {
    padding: 6px 16px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --fg: #e8e8e8;
      --muted: #999999;
      --border: #3a3a3c;
      --row-hover: #2a2a2c;
      --row-active: #2c3a55;
      --badge-degenerate-bg: #4a3218;
      --badge-degenerate-fg: #f0b878;
      --badge-vulns-bg: #1e3a1e;
      --badge-vulns-fg: #8fd98f;
      --link: #7aa7ff;
    }
    .repo-row { border-bottom-color: #2e2e30; }
    details.group summary { border-bottom-color: #2e2e30; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>It-Depends graphs</h1>
      <input id="filter" type="text" placeholder="Filter repos&hellip;" autocomplete="off">
    </div>
    <div id="repo-list"></div>
    <div id="not-published"></div>
  </div>
  <div id="main">
    <div id="header"></div>
    <div id="frame-wrap"></div>
    <div id="footer">Generated 2026-08-06 &middot; it-depends v0.2.1, Docker off</div>
  </div>
</div>

<script>
// Parsed from runs.csv at build time (not fetched at runtime - fetch() of a local

var NOT_PUBLISHED = {
  "RIOT": "no resolver matched (NO-MATCH)",
  "contiki-ng": "no resolver matched (NO-MATCH)",
  "openhab-core": "no resolver matched (NO-MATCH)",
  "android": "no resolver matched (NO-MATCH)",
  "edgex-go": "HTML generation failed: FAILED (KeyError crash in graphs.py)"
};

var CAVEATS = [
  "Docker was off for all runs (no container-layer dependencies resolved).",
  "Dependency depth limit is 2 unless a graph's metadata says otherwise.",
  "The HTML graph view carries no CVE identifiers &mdash; vulnerability counts are shown, not which CVEs.",
  "\"Degenerate\" graphs (1 package, 0 edges) reflect a tool limitation in matching that resolver to that repo's manifest, not an empty dependency tree."
];

function slugEsc(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function repoBySlug(slug) {
  for (var i = 0; i < REPOS.length; i++) {
    if (REPOS[i].slug === slug) return REPOS[i];
  }
  return null;
}

function badge(cls, text) {
  return '<span class="badge ' + cls + '">' + text + '</span>';
}

function metaLine(r) {
  return r.resolver + ' | depth ' + r.depth + ' | ' + r.packages + ' pkgs | ' +
    r.edges + ' edges | ' + r.vulns + ' vulns | ' + r.seconds.toFixed(1) + 's';
}

function renderSidebar(filterText) {
  var list = document.getElementById('repo-list');
  list.innerHTML = '';

  var ft = (filterText || '').toLowerCase();
  var normal = [];
  var degenerate = [];

  REPOS.forEach(function(r) {
    if (ft && r.repo.toLowerCase().indexOf(ft) === -1) return;
    (r.degenerate ? degenerate : normal).push(r);
  });

  normal.sort(function(a, b) { return b.edges - a.edges; });
  degenerate.sort(function(a, b) { return a.repo.localeCompare(b.repo); });

  function makeRow(r) {
    var a = document.createElement('a');
    a.href = '#' + r.slug;
    a.className = 'repo-row';
    a.dataset.slug = r.slug;
    var badges = '';
    if (r.degenerate) badges += badge('badge-degenerate', 'degenerate');
    if (r.vulns === 0) badges += badge('badge-vulns', '0 vulns');
    a.innerHTML = '<div class="repo-name">' + slugEsc(r.repo) + badges + '</div>' +
      '<div class="repo-meta">' + slugEsc(metaLine(r)) + '</div>';
    return a;
  }

  normal.forEach(function(r) { list.appendChild(makeRow(r)); });

  if (degenerate.length) {
    var details = document.createElement('details');
    details.className = 'group';
    var summary = document.createElement('summary');
    summary.textContent = 'Degenerate (no dependencies resolved) — ' + degenerate.length;
    details.appendChild(summary);
    degenerate.forEach(function(r) { details.appendChild(makeRow(r)); });
    list.appendChild(details);
  }

  highlightActive();
}

function renderNotPublished() {
  var el = document.getElementById('not-published');
  var keys = Object.keys(NOT_PUBLISHED);
  if (!keys.length) return;
  var html = '<h2>Not published (' + keys.length + ')</h2><ul>';
  keys.sort().forEach(function(k) {
    html += '<li><strong>' + slugEsc(k) + '</strong>: ' + slugEsc(NOT_PUBLISHED[k]) + '</li>';
  });
  html += '</ul>';
  el.innerHTML = html;
}

function highlightActive() {
  var slug = currentSlug();
  document.querySelectorAll('.repo-row').forEach(function(row) {
    row.classList.toggle('active', row.dataset.slug === slug);
  });
}

function currentSlug() {
  return decodeURIComponent(location.hash.replace(/^#/, ''));
}

function renderLanding() {
  var header = document.getElementById('header');
  var frameWrap = document.getElementById('frame-wrap');
  header.innerHTML = '';
  var caveats = CAVEATS.map(function(c) { return '<li>' + c + '</li>'; }).join('');
  frameWrap.innerHTML = '<div id="landing">' +
    '<h2>It-Depends dependency graphs</h2>' +
    '<p>This page is a static launcher for dependency graphs produced by ' +
    'it-depends across a set of IoT-related open source repositories. ' +
    'Pick a repo on the left to load its graph.</p>' +
    '<p>Generated ' + slugEsc(GEN_DATE_JS) + ' &middot; it-depends v' + slugEsc(VERSION_JS) + ', Docker off.</p>' +
    '<p><strong>Caveats:</strong></p>' +
    '<ul>' + caveats + '</ul>' +
    '</div>';
}

function renderRepo(r) {
  var header = document.getElementById('header');
  var frameWrap = document.getElementById('frame-wrap');

  var badges = '';
  if (r.degenerate) badges += badge('badge-degenerate', 'degenerate');
  if (r.vulns === 0) badges += badge('badge-vulns', '0 vulns');

  var links = '<a href="graphs/' + r.slug + '.html" target="_blank" rel="noopener">Open in new tab</a>';
  links += '<a href="data/' + r.slug + '.json" download>Download JSON</a>';

  var note = '';
  if (r.degenerate) {
    note = '<div id="note">it-depends matched a resolver but resolved no dependencies ' +
      '&mdash; this is a tool limitation, not an empty project.</div>';
  }

  header.innerHTML =
    '<h2>' + slugEsc(r.repo) + badges + '</h2>' +
    '<div id="header-meta">' + slugEsc(metaLine(r)) + '</div>' +
    '<div id="header-links">' + links + '</div>' +
    note;

  frameWrap.innerHTML = '<iframe src="graphs/' + r.slug + '.html" title="' +
    slugEsc(r.repo) + ' dependency graph"></iframe>';
}

function route() {
  var slug = currentSlug();
  if (!slug) {
    renderLanding();
    highlightActive();
    return;
  }
  var r = repoBySlug(slug);
  if (!r) {
    renderLanding();
    highlightActive();
    return;
  }
  renderRepo(r);
  highlightActive();
}

var GEN_DATE_JS = "2026-08-06";
var VERSION_JS = "0.2.1";

document.getElementById('filter').addEventListener('input', function(e) {
  renderSidebar(e.target.value);
});

window.addEventListener('hashchange', route);

renderSidebar('');
renderNotPublished();
route();
</script>

</html>
