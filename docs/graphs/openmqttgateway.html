<html>
<head>
<title>It-Depends | Dependency Graph for npm:OpenMQTTGateway</title>
<style type="text/css">
mynetwork {
    width: 100%;
    height: 100%;
    border: 1px solid lightgray;
}
</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.16.1/vis.css" type="text/css" />
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.16.1/vis-network.min.js"> </script>
<center>
<h1>Dependency Graph for npm:OpenMQTTGateway</h1>
</center>
</head>


<body>
<div id = "mynetwork"></div>

<script type="text/javascript">

// initialize global variables.
var edges;
var nodes;
var network;
var container;
var options, data;


// This method is responsible for drawing the graph, returns the drawn network
function drawGraph() {
    var container = document.getElementById('mynetwork');

    // parsing and collecting nodes and edges from the python
    nodes = new vis.DataSet([{'id': 0, 'label': 'npm:OpenMQTTGateway', 'shape': 'square', 'color': 'red', 'borderWidth': 4, 'level': 0}, {'id': 1, 'label': 'npm:ini', 'level': 1}, {'id': 2, 'label': 'npm:markdown-table', 'level': 1}, {'id': 3, 'label': 'npm:mime-db', 'level': 2}, {'id': 4, 'label': 'npm:mime-types', 'level': 1}]);
    edges = new vis.DataSet([{'from': 0, 'to': 4, 'shape': 'dot'}, {'from': 0, 'to': 1, 'shape': 'dot'}, {'from': 0, 'to': 2, 'shape': 'dot'}, {'from': 4, 'to': 3, 'shape': 'dot'}]);


    // adding nodes and edges to the graph
    data = {nodes: nodes, edges: edges};


    const options = {
        manipulation: false,
        height: "90%",
        physics: {
            hierarchicalRepulsion: {
              nodeDistance: 300,
            },
          },
        edges: {
            color: {
                inherit: false
            },
            arrows: {
                to: true,
            },
        },
        layout: {
            hierarchical: true
        }
    };



    network = new vis.Network(container, data, options);
    return network;

}

drawGraph();

</script>
</body>
</html>
