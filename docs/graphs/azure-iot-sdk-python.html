<html>
<head>
<title>It-Depends | Dependency Graph for pip:azure-iot-device</title>
<style type="text/css">
mynetwork {
    width: 100%;
    height: 100%;
    border: 1px solid lightgray;
}
</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.16.1/vis.css" type="text/css" />
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.16.1/vis-network.min.js"> </script>
<center>
<h1>Dependency Graph for pip:azure-iot-device</h1>
</center>
</head>


<body>
<div id = "mynetwork"></div>

<script type="text/javascript">

// initialize global variables.
var edges;
var nodes;
var network;
var container;
var options, data;


// This method is responsible for drawing the graph, returns the drawn network
function drawGraph() {
    var container = document.getElementById('mynetwork');

    // parsing and collecting nodes and edges from the python
    nodes = new vis.DataSet([{'id': 0, 'label': 'pip:azure-iot-device', 'shape': 'square', 'color': 'red', 'borderWidth': 4, 'level': 0}, {'id': 1, 'label': 'pip:certifi', 'color': 'red', 'level': 2}, {'id': 2, 'label': 'pip:charset-normalizer', 'level': 2}, {'id': 3, 'label': 'pip:deprecation', 'level': 1}, {'id': 4, 'label': 'pip:idna', 'color': 'red', 'level': 2}, {'id': 5, 'label': 'pip:janus', 'color': 'red', 'level': 1}, {'id': 6, 'label': 'pip:packaging', 'level': 2}, {'id': 7, 'label': 'pip:paho-mqtt', 'level': 1}, {'id': 8, 'label': 'pip:pysocks', 'level': 1}, {'id': 9, 'label': 'pip:requests', 'level': 1}, {'id': 10, 'label': 'pip:requests-unixsocket', 'level': 1}, {'id': 11, 'label': 'pip:typing-extensions', 'color': 'red', 'level': 1}, {'id': 12, 'label': 'pip:urllib3', 'color': 'red', 'level': 2}]);
    edges = new vis.DataSet([{'from': 0, 'to': 8, 'shape': 'dot'}, {'from': 0, 'to': 10, 'shape': 'dot'}, {'from': 0, 'to': 9, 'shape': 'dot'}, {'from': 0, 'to': 5, 'shape': 'dot'}, {'from': 0, 'to': 3, 'shape': 'dot'}, {'from': 0, 'to': 11, 'shape': 'dot'}, {'from': 0, 'to': 7, 'shape': 'dot'}, {'from': 3, 'to': 6, 'shape': 'dot'}, {'from': 9, 'to': 12, 'shape': 'dot'}, {'from': 9, 'to': 2, 'shape': 'dot'}, {'from': 9, 'to': 1, 'shape': 'dot'}, {'from': 9, 'to': 4, 'shape': 'dot'}, {'from': 10, 'to': 9, 'shape': 'dot'}]);


    // adding nodes and edges to the graph
    data = {nodes: nodes, edges: edges};


    const options = {
        manipulation: false,
        height: "90%",
        physics: {
            hierarchicalRepulsion: {
              nodeDistance: 300,
            },
          },
        edges: {
            color: {
                inherit: false
            },
            arrows: {
                to: true,
            },
        },
        layout: {
            hierarchical: true
        }
    };



    network = new vis.Network(container, data, options);
    return network;

}

drawGraph();

</script>
</body>
</html>
